<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Sourceful — Document Question-Answering Platform</title>
  <desc id="desc">Header banner: Sourceful wordmark with a document-to-cited-answer illustration</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#100e0c"/>
      <stop offset="1" stop-color="#171411"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221e1a"/>
      <stop offset="1" stop-color="#1a1714"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9775e"/>
      <stop offset="1" stop-color="#e8925d"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1280" height="360" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>

    <!-- Quiet left wash — no multi-glow stacks -->
    <rect x="0" y="0" width="520" height="360" fill="#d9775e" fill-opacity="0.04"/>

    <!-- Thin top rule -->
    <line x1="0" y1="0.5" x2="1280" y2="0.5" stroke="#ede8e0" stroke-opacity="0.08"/>

    <!-- ========== Brand (left, clear of illustration) ========== -->
    <g transform="translate(64, 118)">
      <!-- Mark: simple source mark — open bracket + mark, not a sparkle orb -->
      <g transform="translate(0, -2)">
        <rect x="0" y="0" width="36" height="44" rx="6" fill="none" stroke="#d9775e" stroke-width="2"/>
        <rect x="8" y="12" width="20" height="3" rx="1.5" fill="#d9775e"/>
        <rect x="8" y="20" width="14" height="2.5" rx="1.25" fill="#ede8e0" fill-opacity="0.35"/>
        <rect x="8" y="27" width="17" height="2.5" rx="1.25" fill="#ede8e0" fill-opacity="0.22"/>
      </g>

      <text x="52" y="30"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="42" font-weight="650" letter-spacing="-0.03em"
        fill="#f3eee6">Sourceful</text>

      <text x="52" y="62"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="16" font-weight="400"
        fill="#a0958a">Ask your documents. Get answers with sources.</text>

      <!-- Pipeline as quiet text, not stacked ALL-CAPS labels under art -->
      <g transform="translate(52, 98)"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="13" font-weight="500" fill="#7a7065">
        <text x="0" y="0">Ingest</text>
        <text x="52" y="0" fill="#524a43">→</text>
        <text x="72" y="0">Retrieve</text>
        <text x="136" y="0" fill="#524a43">→</text>
        <text x="156" y="0">Cite</text>
      </g>
    </g>

    <!-- ========== Illustration (right): one scene, no caption pile-up ========== -->
    <g transform="translate(560, 48)">

      <!-- Connector spine (straight, editorial — not rainbow flow beams) -->
      <path d="M168 150 H248" fill="none" stroke="#ede8e0" stroke-opacity="0.14" stroke-width="1.5"/>
      <path d="M408 150 H488" fill="none" stroke="#ede8e0" stroke-opacity="0.14" stroke-width="1.5"/>
      <circle cx="248" cy="150" r="3" fill="#d9775e" fill-opacity="0.7"/>
      <circle cx="408" cy="150" r="3" fill="#6baa7a" fill-opacity="0.75"/>
      <circle cx="488" cy="150" r="3" fill="#6baa7a" fill-opacity="0.75"/>

      <!-- 1. Document -->
      <g transform="translate(0, 36)">
        <!-- Stack shadow pages -->
        <rect x="10" y="10" width="148" height="196" rx="8" fill="#1a1714" stroke="#ede8e0" stroke-opacity="0.06"/>
        <rect x="5" y="5" width="148" height="196" rx="8" fill="#1e1b17" stroke="#ede8e0" stroke-opacity="0.08"/>
        <!-- Main page -->
        <rect x="0" y="0" width="148" height="196" rx="8" fill="url(#panel)" stroke="#ede8e0" stroke-opacity="0.14"/>
        <!-- Page header -->
        <rect x="16" y="20" width="72" height="5" rx="2.5" fill="#ede8e0" fill-opacity="0.2"/>
        <rect x="16" y="34" width="48" height="3.5" rx="1.75" fill="#ede8e0" fill-opacity="0.1"/>
        <!-- Body lines -->
        <rect x="16" y="56" width="116" height="3.5" rx="1.75" fill="#ede8e0" fill-opacity="0.1"/>
        <rect x="16" y="68" width="108" height="3.5" rx="1.75" fill="#ede8e0" fill-opacity="0.08"/>
        <rect x="16" y="80" width="112" height="3.5" rx="1.75" fill="#ede8e0" fill-opacity="0.08"/>
        <!-- Selected passage (the source) -->
        <rect x="12" y="100" width="124" height="40" rx="4" fill="#d9775e" fill-opacity="0.12"/>
        <rect x="12" y="100" width="3" height="40" rx="1.5" fill="#d9775e"/>
        <rect x="22" y="112" width="96" height="3.5" rx="1.75" fill="#d9775e" fill-opacity="0.75"/>
        <rect x="22" y="124" width="84" height="3.5" rx="1.75" fill="#d9775e" fill-opacity="0.45"/>
        <!-- More body -->
        <rect x="16" y="156" width="110" height="3.5" rx="1.75" fill="#ede8e0" fill-opacity="0.07"/>
        <rect x="16" y="168" width="92" height="3.5" rx="1.75" fill="#ede8e0" fill-opacity="0.06"/>
      </g>

      <!-- 2. Retrieved chunk (middle card — sparse) -->
      <g transform="translate(264, 78)">
        <rect x="0" y="0" width="128" height="144" rx="8" fill="url(#panel)" stroke="#ede8e0" stroke-opacity="0.14"/>
        <text x="14" y="28"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#7a7065">chunk</text>
        <text x="114" y="28" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#524a43">p.4</text>
        <line x1="14" y1="40" x2="114" y2="40" stroke="#ede8e0" stroke-opacity="0.08"/>
        <rect x="14" y="56" width="100" height="3.5" rx="1.75" fill="#ede8e0" fill-opacity="0.16"/>
        <rect x="14" y="68" width="88" height="3.5" rx="1.75" fill="#ede8e0" fill-opacity="0.1"/>
        <rect x="14" y="80" width="96" height="3.5" rx="1.75" fill="#ede8e0" fill-opacity="0.1"/>
        <rect x="14" y="92" width="72" height="3.5" rx="1.75" fill="#ede8e0" fill-opacity="0.08"/>
        <!-- Score bar — factual, not glowing -->
        <rect x="14" y="116" width="100" height="6" rx="3" fill="#ede8e0" fill-opacity="0.06"/>
        <rect x="14" y="116" width="72" height="6" rx="3" fill="#d9775e" fill-opacity="0.65"/>
        <text x="14" y="136"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" fill="#7a7065">0.82</text>
      </g>

      <!-- 3. Answer with citations -->
      <g transform="translate(504, 60)">
        <rect x="0" y="0" width="172" height="180" rx="8" fill="url(#panel)" stroke="#ede8e0" stroke-opacity="0.14"/>
        <!-- Header row -->
        <circle cx="18" cy="22" r="4" fill="#6baa7a"/>
        <text x="30" y="26"
          font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="12" font-weight="500" fill="#c8c0b4">Answer</text>
        <line x1="14" y1="40" x2="158" y2="40" stroke="#ede8e0" stroke-opacity="0.08"/>
        <!-- Answer body -->
        <rect x="14" y="56" width="130" height="4" rx="2" fill="#ede8e0" fill-opacity="0.18"/>
        <rect x="14" y="70" width="144" height="3.5" rx="1.75" fill="#ede8e0" fill-opacity="0.1"/>
        <rect x="14" y="84" width="120" height="3.5" rx="1.75" fill="#ede8e0" fill-opacity="0.1"/>
        <!-- Inline citation markers -->
        <g transform="translate(14, 104)"
          font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="11" font-weight="600">
          <rect x="0" y="0" width="28" height="20" rx="4" fill="#d9775e" fill-opacity="0.18" stroke="#d9775e" stroke-opacity="0.55"/>
          <text x="14" y="14" text-anchor="middle" fill="#e89870">[1]</text>
          <rect x="34" y="0" width="28" height="20" rx="4" fill="#6baa7a" fill-opacity="0.14" stroke="#6baa7a" stroke-opacity="0.45"/>
          <text x="48" y="14" text-anchor="middle" fill="#7fbd8e">[2]</text>
        </g>
        <rect x="14" y="138" width="136" height="3.5" rx="1.75" fill="#ede8e0" fill-opacity="0.08"/>
        <rect x="14" y="152" width="100" height="3.5" rx="1.75" fill="#ede8e0" fill-opacity="0.06"/>
      </g>
    </g>

    <!-- Bottom rule -->
    <line x1="0" y1="359.5" x2="1280" y2="359.5" stroke="#ede8e0" stroke-opacity="0.08"/>
  </g>
</svg>
